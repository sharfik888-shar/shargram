name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Insert API keys
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = [0-9]*;/APP_ID = ${{ secrets.TG_API_ID }};/" $F
          sed -i "s/APP_HASH = \"[^\"]*\"/APP_HASH = \"${{ secrets.TG_API_HASH }}\"/" $F
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shargram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
